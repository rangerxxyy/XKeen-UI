name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: release/web/
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: release/web/
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo build --release --manifest-path backend/Cargo.toml --locked
      - name: Exercise install, update, service, and remove in an isolated prefix
        run: |
          set -euo pipefail
          ROOT=$(mktemp -d)
          PACKAGE="$ROOT/package"
          PREFIX="$ROOT/entware"
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')
          mkdir -p "$PACKAGE/web"
          mkdir -p "$PREFIX/etc/init.d"
          printf '#!/bin/sh\nENABLED=yes\nPROCS=xkeen-ui\nARGS="-p 1000"\n' > "$PREFIX/etc/init.d/S99xkeen-ui"
          cp "$PREFIX/etc/init.d/S99xkeen-ui" "$ROOT/legacy-service.expected"
          cp backend/target/release/xkeen-ui "$PACKAGE/xkeen-ui"
          cp -R release/web/. "$PACKAGE/web/"
          cleanup() {
            if [ -x "$PREFIX/share/xkeen-ui/xkeen-ui" ]; then
              "$PREFIX/share/xkeen-ui/xkeen-ui" service stop --prefix "$PREFIX" || true
            fi
            rm -rf "$ROOT"
          }
          trap cleanup EXIT
          XKEEN_BIND=127.0.0.1 XKEEN_MIHOMO_URL=http://127.0.0.1:9090 XKEEN_MIHOMO_SECRET=ci-test-secret \
            "$PACKAGE/xkeen-ui" install --prefix "$PREFIX" --package-dir "$PACKAGE" --port "$PORT"
          CONFIG="$PREFIX/etc/xkeen-ui.env"
          test "$(stat -c '%a' "$CONFIG")" = 600
          grep -qx 'XKEEN_MIHOMO_URL=http://127.0.0.1:9090' "$CONFIG"
          grep -qx 'XKEEN_MIHOMO_SECRET=ci-test-secret' "$CONFIG"
          curl --fail --silent "http://127.0.0.1:$PORT/" | grep -q '<div id="app"></div>'
          JS_ASSET=$(find "$PREFIX/share/xkeen-ui/web/assets" -name 'main-*.js' -printf '%f\n' | head -n 1)
          CSS_ASSET=$(find "$PREFIX/share/xkeen-ui/web/assets" -name 'main-*.css' -printf '%f\n' | head -n 1)
          test -n "$JS_ASSET" && test -n "$CSS_ASSET"
          curl --fail --silent "http://127.0.0.1:$PORT/assets/$JS_ASSET" >/dev/null
          curl --fail --silent "http://127.0.0.1:$PORT/assets/$CSS_ASSET" >/dev/null
          ! grep -q '^XKEEN_TOKEN=' "$CONFIG"
          grep -qx 'XKEEN_BIND=127.0.0.1' "$CONFIG"
          curl --fail --silent "http://127.0.0.1:$PORT/api/v1/status" | grep -q '"mode":"router"'
          test "$(curl --silent --output "$ROOT/missing-api.json" --write-out '%{http_code}' "http://127.0.0.1:$PORT/api/v1/does-not-exist")" = 404
          grep -q '"error":"API endpoint not found"' "$ROOT/missing-api.json"
          "$PACKAGE/xkeen-ui" update --prefix "$PREFIX" --package-dir "$PACKAGE"
          test -x "$PREFIX/etc/init.d/S99xkeen-ui-panel"
          cmp "$ROOT/legacy-service.expected" "$PREFIX/etc/init.d/S99xkeen-ui"
          "$PREFIX/etc/init.d/S99xkeen-ui-panel" status
          "$PREFIX/share/xkeen-ui/xkeen-ui" remove --prefix "$PREFIX"
          test ! -e "$PREFIX/share/xkeen-ui"
          test ! -e "$PREFIX/etc/init.d/S99xkeen-ui-panel"
          cmp "$ROOT/legacy-service.expected" "$PREFIX/etc/init.d/S99xkeen-ui"
          test -f "$CONFIG"
          compgen -G "$PREFIX/share/xkeen-ui.backup.*" >/dev/null

  router-aarch64:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: release/web/
      - run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - run: cross build --release --locked --target aarch64-unknown-linux-gnu
        working-directory: backend
        env:
          RUSTFLAGS: -C link-arg=-Wl,--dynamic-linker=/opt/lib/ld-linux-aarch64.so.1 -C link-arg=-Wl,-rpath,/opt/lib
      - run: |
          set -euo pipefail
          mkdir -p router-aarch64/web
          cp backend/target/aarch64-unknown-linux-gnu/release/xkeen-ui router-aarch64/xkeen-ui
          cp -R release/web/. router-aarch64/web/
          chmod 755 router-aarch64/xkeen-ui
          tar -czf xkeen-ui-linux-aarch64.tar.gz -C router-aarch64 xkeen-ui web
          sha256sum xkeen-ui-linux-aarch64.tar.gz > SHA256SUMS
          tar -tvzf xkeen-ui-linux-aarch64.tar.gz | awk '$NF == "xkeen-ui" && substr($1, 4, 1) == "x" { found=1 } END { exit !found }'
      - uses: actions/upload-artifact@v4
        with:
          name: release-aarch64
          path: |
            xkeen-ui-linux-aarch64.tar.gz
            SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: router-aarch64-test
          path: router-aarch64/
          if-no-files-found: error

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - run: sh tests/installer-proxy-priority.sh
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh
