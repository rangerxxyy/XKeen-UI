name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-web
          path: release/web/
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path backend/Cargo.toml -- --check
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo build --release --manifest-path backend/Cargo.toml --locked

  router-aarch64:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: actions/download-artifact@v4
        with:
          name: frontend-web
          path: release/web/
      - run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - run: cross build --release --locked --target aarch64-unknown-linux-gnu
        working-directory: backend
        env:
          RUSTFLAGS: -C link-arg=-Wl,--dynamic-linker=/opt/lib/ld-linux-aarch64.so.1 -C link-arg=-Wl,-rpath,/opt/lib
      - run: |
          mkdir -p router-aarch64/web
          cp backend/target/aarch64-unknown-linux-gnu/release/xkeen-ui router-aarch64/xkeen-ui
          cp -R release/web/. router-aarch64/web/
      - uses: actions/upload-artifact@v4
        with:
          name: router-aarch64-test
          path: router-aarch64/
          if-no-files-found: error

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh
